services:
  gateway:
    environment:
      GAMESHELF_WORKSPACE_EXPORT_ROOT: /workspace-exports
      GAMESHELF_WORKSPACE_MANIFEST: /workspace-manifest.json
    volumes:
      - type: bind
        source: ${GAMESHELF_WORKSPACE_EXPORT_DIR:?Set the dedicated shared workspace export mount}
        target: /workspace-exports
        bind:
          create_host_path: false
          propagation: rshared
      - type: bind
        source: ${GAMESHELF_WORKSPACE_MANIFEST_FILE:?Set the private workspace preflight manifest}
        target: /workspace-manifest.json
        read_only: true
        bind:
          create_host_path: false
